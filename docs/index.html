<div id="app">
  <div id="stage"></div>
  <div id="worldUI"></div>

  <header id="hud">
    <div class="hud-row">
      <div class="cap cap--cash">
        <span class="cap__ic"><svg><use href="#i-coin"/></svg></span>
        <b class="cap__v" id="cash">0</b>
      </div>
      <button class="cap cap--gem" id="goldPill">
        <span class="cap__ic"><svg><use href="#i-gem"/></svg></span>
        <b class="cap__v" id="gold">0</b>
        <i class="cap__add">+</i>
      </button>
      <button class="cap cap--gear" id="gearBtn" aria-label="Настройки">
        <span class="cap__ic"><svg><use href="#i-gear"/></svg></span>
      </button>
    </div>
    <button class="rep" id="repPill">
      <span class="rep__ic"><svg><use href="#i-star"/></svg></span>
      <b class="rep__v" id="repV">4.2</b>
      <i class="badge" id="repBadge" hidden></i>
    </button>
    <div class="lvl">
      <span class="lvl__n" id="lvlN">1</span>
      <span class="lvl__track"><i class="lvl__fill" id="lvlFill"></i></span>
      <span class="lvl__num" id="xpNum">0 / 0</span>
    </div>
  </header>

  <div id="carry" hidden>
    <span class="carry__ic"><svg><use href="#i-bag"/></svg></span>
    <span class="carry__track"><i class="carry__fill" id="carryFill"></i></span>
    <b class="carry__n" id="carryTxt">0</b>
  </div>

  <div id="joy"><div id="joyBase"></div><div id="joyKnob"></div></div>

  <nav id="nav">
    <button class="nav-btn is-on" data-tab="bank"><span class="nav-btn__ic"><svg><use href="#i-box"/></svg></span><b>Пункт</b></button>
    <button class="nav-btn" data-tab="tasks"><span class="nav-btn__ic"><svg><use href="#i-tasks"/></svg></span><b>Задания</b><i class="badge" hidden></i></button>
    <button class="nav-btn" data-tab="staff"><span class="nav-btn__ic"><svg><use href="#i-staff"/></svg></span><b>Персонал</b><i class="badge" hidden></i></button>
    <button class="nav-btn" data-tab="safes"><span class="nav-btn__ic"><svg><use href="#i-gift"/></svg></span><b>Награды</b><i class="badge" hidden></i></button>
    <button class="nav-btn" data-tab="shop"><span class="nav-btn__ic"><svg><use href="#i-shop"/></svg></span><b>Магазин</b></button>
  </nav>

  <div id="winRoot"></div>
  <div id="toasts"></div>
</div>
